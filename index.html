<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scholarlylife</title>
<meta name="description" content="scholarlylife.com 正在建设中。一个关于学术、工具与产品的个人站点。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B6FBF'/%3E%3Cpath d='M9 21V11M13.5 21V7M18 21V13M22.5 21V9' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#0A1526; --ink-2:#3A4759; --ink-3:#66748A;
    --line:#E3E9F2; --blue:#1B6FBF; --bg:#FFFFFF;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Manrope","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:grid; place-items:center;
    padding:24px;
  }
  main{max-width:680px;width:100%}
  .mark{display:flex;align-items:center;gap:10px;margin-bottom:48px}
  .mark svg{width:36px;height:36px}
  .mark b{font-size:18px;font-weight:600;letter-spacing:-.01em}
  .kicker{
    display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--blue);
    border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:24px;
  }
  h1{
    font-size:60px;line-height:1;font-weight:600;letter-spacing:-.03em;
    max-width:680px;text-wrap:balance;
    background:linear-gradient(90deg,#000 0%,#666 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p{margin-top:24px;font-size:18px;line-height:1.6;color:var(--ink-2);max-width:560px;text-wrap:pretty}
  a{
    display:inline-flex;align-items:center;gap:8px;margin-top:40px;
    font-size:16px;font-weight:600;color:#fff;background:var(--blue);
    padding:12px 24px;border-radius:999px;text-decoration:none;
    transition:background .3s var(--ease),transform .5s var(--ease);
  }
  a:hover{background:#155C9E;transform:translateY(-2px)}
  footer{
    margin-top:96px;padding-top:24px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;
    font-size:12px;color:var(--ink-3);
  }
  @media (max-width:640px){
    h1{font-size:44px}
    p{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){a{transition:none}a:hover{transform:none}}
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#1B6FBF"/>
      <path d="M9 21V11M13.5 21V7M18 21V13M22.5 21V9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <b>scholarlylife</b>
  </div>

  <span class="kicker">正在建设</span>
  <h1>学术之外，<br>还有生活。</h1>
  <p>这里是 scholarlylife.com。一个用来放我做过的工具、写过的东西、以及还没做完的想法的地方。</p>
  <p>站点还在搭建中。等备案下来，会正式搬到这个域名上。</p>

  <a href="mailto:jiangz@stu.xmu.edu.cn">
    联系我
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
  </a>

  <footer>
    <span>© 2026 scholarlylife</span>
    <span>ICP 备案办理中</span>
  </footer>
</main>
</body>
</html>
